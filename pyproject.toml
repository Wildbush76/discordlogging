[project]
name = "discord.py.logging"
version = "0.1.0"
description = "A logger handle that uses discord"
readme = "README.md"
authors = [
    { name = "Wildbush", email = "75509166+Wildbush76@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7.1",
    "ratelimit>=2.2.1",
]
license="MIT"
license-files=["LICENSE"]


[tool.setuptools]
packages = ["discord.ext.logging"]

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "dpytest>=0.7.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord"]
